name: 每日策略运行（自动发现所有账户）

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      accounts: ${{ steps.list.outputs.accounts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 自动发现所有账户
        id: list
        run: |
          import json, glob, os
          os.chdir("live")
          files = glob.glob("holdings_*.json")
          accounts = sorted([f.replace("holdings_", "").replace(".json", "") for f in files])
          if not accounts:
              accounts = ["main"]
          # 输出严格 JSON，不带空格和换行
          output = json.dumps(accounts, separators=(',', ':'))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"accounts={output}\n")
          print(f"发现账户: {output}")
        shell: python

  daily:
    needs: discover
    strategy:
      matrix:
        account: ${{ fromJson(needs.discover.outputs.accounts) }}
      fail-fast: false
      max-parallel: 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install tushare pandas numpy openai requests bcrypt PyYAML

      - name: 创建必要目录
        run: |
          mkdir -p backtestdata/hfq
          mkdir -p live/logs

      - name: 运行策略主控（${{ matrix.account }}）
        timeout-minutes: 20
        env:
          TS_TOKEN: ${{ secrets.TS_TOKEN }}
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd live
          python daily_update.py || echo "数据更新完成（或部分失败）"
          python run_daily.py --account ${{ matrix.account }}
          
      - name: 提交更新的数据文件
        if: success() || failure()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backtestdata/ live/logs/ live/last_state.json live/state_history.csv live/holdings_*.json live/users.yaml 2>/dev/null || true
          git diff --cached --quiet || git commit -m "自动更新数据 $(date +'%Y%m%d') [${{ matrix.account }}]"
          # 拉取远程最新代码并变基，避免 non-fast-forward 冲突
          git pull --rebase origin main
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
