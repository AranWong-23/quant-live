name: 每日策略运行

on:
  schedule:
    - cron: '30 0 * * 1-5'   # UTC 0:30 = 北京时间 8:30
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install tushare pandas numpy openai requests bcrypt PyYAML

      - name: 初始化数据（仅首次）
        env:
          TS_TOKEN: ${{ secrets.TS_TOKEN }}
        run: |
          cd live
          if [ ! -f "../backtestdata/index_000300.SH.csv" ]; then
            echo "首次运行，正在下载全量历史数据，约需15分钟..."
            python daily_update.py
          else
            echo "数据已存在，跳过初始化"
          fi

      - name: 运行策略并推送
        env:
          TS_TOKEN: ${{ secrets.TS_TOKEN }}
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          cd live
          python run_daily.py --account Aran

      - name: 提交数据更新
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backtestdata/ live/logs/ live/last_state.json live/state_history.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "自动更新数据 $(date +'%Y%m%d')"
          git push
