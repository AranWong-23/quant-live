name: 每日策略运行

on:
  schedule:
    - cron: '30 0 * * 1-5'   # UTC 0:30 = 北京时间 8:30
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install tushare pandas numpy openai requests bcrypt PyYAML

      - name: 创建必要目录
        run: |
          mkdir -p backtestdata
          mkdir -p live/logs

      - name: 运行策略主控
        env:
          TS_TOKEN: ${{ secrets.TS_TOKEN }}
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd live
          python daily_update.py
          python run_daily.py --account Aran

      - name: 提交更新的数据文件
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backtestdata/ live/logs/ live/last_state.json live/state_history.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "自动更新数据 $(date +'%Y%m%d')"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
